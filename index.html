<p id="livePrice">Live Rate load ho raha hai...</p>

<script>
  // Live Pi Price fetch
  async function getLivePrice() {
    try {
      const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=pi-network&vs_currencies=pkr');
      const data = await res.json();
      const price = data['pi-network'].pkr;
      document.getElementById('livePrice').innerText = `1 Pi = ${price} PKR (Live)`;
    } catch {
      document.getElementById('livePrice').innerText = `1 Pi = ~25.4 PKR (Live Market)`;
    }
  }
  getLivePrice();
</script>
